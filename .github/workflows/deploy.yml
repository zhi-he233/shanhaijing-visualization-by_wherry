name: 构建并部署到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# GitHub Pages 官方推荐的权限组合：读源码、写 Pages、用 OIDC 令牌部署
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署；不打断正在进行的发布，避免线上出现半成品
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建（含 tsc 类型检查）
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布
        id: deployment
        uses: actions/deploy-pages@v4
